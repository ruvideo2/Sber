<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Терминал оплаты</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#21a038; --green-deep:#127a28; --ink:#14301b; --muted:#6b8272; --card:#ffffff; --key:#eef5ef; --bg:#dfeee2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#e6f4e9; --muted:#8fae97; --card:#14241a; --key:#1d3325; --bg:#0b140e;}
}
:root[data-theme="dark"]{--ink:#e6f4e9; --muted:#8fae97; --card:#14241a; --key:#1d3325; --bg:#0b140e;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center}
.terminal{position:fixed;inset:0;width:100%;height:100%;background:var(--card);overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;padding:max(28px,env(safe-area-inset-top,0px)) max(24px,calc((100% - 540px)/2)) max(28px,env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transform:scale(.97);transition:opacity .5s ease,transform .5s ease,visibility 0s .5s}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease,transform .5s ease}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--green)}
.brand i{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,#21a038,#a5d63f,#21a038);display:block}
.label{margin:28px 0 6px;color:var(--muted);font-weight:500;font-size:16px}
.amount{font-size:clamp(44px,13vw,60px);font-weight:800;letter-spacing:-.02em;min-height:1.2em;font-variant-numeric:tabular-nums;white-space:nowrap}
.amount.empty{color:var(--muted);opacity:.5}
.keys{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:64px;border:0;border-radius:18px;background:var(--key);color:var(--ink);font:700 26px 'Manrope',system-ui,sans-serif;cursor:pointer;transition:transform .12s,background .2s}
.keys button:active{transform:scale(.94);background:#cfe6d3}
.keys button:focus-visible,.go:focus-visible,.method:focus-visible,.back:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.go{margin-top:14px;height:66px;border:0;border-radius:20px;background:var(--green);color:#fff;font:800 20px 'Manrope',system-ui,sans-serif;cursor:pointer;transition:transform .12s,opacity .3s,background .2s}
.go:disabled{opacity:.35;cursor:default}
.go:not(:disabled):active{transform:scale(.97);background:var(--green-deep)}
.back{align-self:flex-start;border:0;background:none;color:var(--muted);font:700 16px 'Manrope',system-ui,sans-serif;padding:6px 0;cursor:pointer}
.sum{margin:18px 0 0;font-size:44px;font-weight:800;letter-spacing:-.02em}
.methods{margin-top:auto;display:grid;gap:14px}
.method{display:flex;align-items:center;gap:18px;padding:16px 22px;border:0;border-radius:24px;background:var(--key);color:var(--ink);font:800 22px 'Manrope',system-ui,sans-serif;text-align:left;cursor:pointer;transition:transform .15s,background .25s,color .25s}
.method svg{width:48px;height:48px;flex:none;stroke:var(--green);transition:stroke .25s}
.method small{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:3px;transition:color .25s}
.method:active{transform:scale(.97);background:var(--green);color:#fff}
.method:active svg{stroke:#fff}.method:active small{color:#e3f6e7}
.methods .method:first-child{background:var(--green);color:#fff}
.methods .method:first-child svg{stroke:#fff}.methods .method:first-child small{color:#e3f6e7}
#ok{background:var(--green);color:#fff;align-items:center;justify-content:center;text-align:center}
.badge{position:relative;width:150px;height:150px;display:grid;place-items:center}
.badge .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.7);opacity:0}
.badge .disc{position:absolute;inset:14px;border-radius:50%;background:#fff;transform:scale(0)}
.badge svg{position:relative;width:70px;height:70px}
.badge path{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 200;stroke-dashoffset:100;opacity:0}
#ok.active .disc{animation:pop .55s cubic-bezier(.2,1.4,.4,1) .1s forwards}
#ok.active .badge path{animation:draw .45s ease-out .55s forwards}
#ok.active .ring{animation:ring 1.3s ease-out .35s}
#ok.active .ring+.ring{animation-delay:.6s}
#ok h2{margin:30px 0 6px;font-size:32px;font-weight:800;opacity:0;transform:translateY(8px)}
#ok p{margin:0;font-size:20px;font-weight:500;opacity:0;transform:translateY(8px)}
#ok.active h2{animation:up .5s ease .8s forwards}
#ok.active p{animation:up .5s ease .95s forwards}
.tap{flex:1;position:relative;display:grid;place-items:center;min-height:0}
.waves span{position:absolute;left:50%;top:42%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:3px solid var(--green);opacity:0;animation:wave 2.4s ease-out infinite}
.waves span:nth-child(2){animation-delay:.8s}
.waves span:nth-child(3){animation-delay:1.6s}
.card{position:absolute;left:50%;top:42%;width:190px;height:120px;margin:-60px 0 0 -95px;border-radius:18px;background:linear-gradient(135deg,var(--green),var(--green-deep));box-shadow:0 14px 30px rgba(18,122,40,.35);animation:approach 2.4s ease-in-out infinite}
.card::before{content:"";position:absolute;left:18px;top:22px;width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#f3dc8a,#c9a94a)}
.card::after{content:"";position:absolute;left:18px;bottom:20px;width:100px;height:8px;border-radius:4px;background:rgba(255,255,255,.35)}
@keyframes approach{0%{transform:translateY(150px) rotate(-8deg) scale(.9)}55%,100%{transform:none}}
@keyframes wave{0%{transform:scale(.2);opacity:.8}100%{transform:scale(1.2);opacity:0}}
@keyframes slide{to{transform:translateX(-50%)}}
@media (max-height:780px){.methods{gap:10px}.method{padding:12px 18px;font-size:19px;border-radius:20px}.method svg{width:38px;height:38px}.method small{font-size:13px}.sum{font-size:38px}.keys button{height:56px}}
.gear{margin-left:auto;width:44px;height:44px;border-radius:14px;border:0;background:var(--key);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .12s}
.gear:active{transform:scale(.92)}
.gear:focus-visible,.opt:focus-visible,.eb:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.sheet{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.sheet.open{opacity:1;visibility:visible;transition:opacity .3s}
.sheet-box{width:min(540px,100%);background:var(--card);border-radius:28px 28px 0 0;padding:24px 24px max(24px,env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .35s ease}
.sheet.open .sheet-box{transform:none}
.sheet h3{margin:0 0 14px;font-size:20px;font-weight:800}
.opt{display:block;width:100%;text-align:left;padding:15px 18px;margin-bottom:8px;border-radius:16px;border:2px solid transparent;background:var(--key);color:var(--ink);font:700 17px 'Manrope',system-ui,sans-serif;cursor:pointer;transition:border-color .2s}
.opt.sel{border-color:var(--green)}
.opt.sel::after{content:"✓";float:right;color:var(--green)}
#err{background:#d6362b;color:#fff;align-items:center;justify-content:center;text-align:center}
#err .badge path{stroke:#d6362b}
#err.active .disc{animation:pop .55s cubic-bezier(.2,1.4,.4,1) .1s forwards}
#err.active .badge path{animation:draw .35s ease-out .55s forwards}
#err.active .badge path+path{animation-delay:.8s}
#err.active .badge{animation:shake .5s ease .95s}
#err.active .ring{animation:ring 1.3s ease-out .35s}
#err.active .ring+.ring{animation-delay:.6s}
#err h2{margin:30px 0 8px;font-size:30px;font-weight:800;opacity:0;transform:translateY(8px)}
#err p{margin:0;max-width:340px;font-size:19px;font-weight:500;opacity:0;transform:translateY(8px)}
.eact{display:flex;gap:12px;margin-top:34px;opacity:0;transform:translateY(8px)}
#err.active h2{animation:up .5s ease .8s forwards}
#err.active p{animation:up .5s ease .95s forwards}
#err.active .eact{animation:up .5s ease 1.1s forwards}
.eb{height:56px;padding:0 28px;border:0;border-radius:18px;background:#fff;color:#d6362b;font:800 18px 'Manrope',system-ui,sans-serif;cursor:pointer}
.eb.ghost{background:rgba(255,255,255,.2);color:#fff}
#err .eb:focus-visible{outline-color:#fff}
.logo{width:26px;height:26px;padding:0;border:0;border-radius:50%;background:conic-gradient(from 200deg,#21a038,#a5d63f,#21a038);cursor:pointer;flex:none}
.logo:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.logo.on{animation:spin 2.4s linear infinite;box-shadow:0 0 0 4px rgba(33,160,56,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-stop{position:absolute;top:max(6px,env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-8px);z-index:4;border:0;border-radius:12px;padding:3px 12px;background:rgba(20,48,27,.85);color:#fff;font:700 12px 'Manrope',system-ui,sans-serif;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .3s,transform .3s,visibility 0s .3s}
.demo-stop.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .3s,transform .3s}
.keys button.press{transform:scale(.94);background:#cfe6d3;color:#14301b}
.go.press{transform:scale(.97);background:var(--green-deep)}
.method.press{transform:scale(.97);background:var(--green);color:#fff}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes draw{from{opacity:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.screen.active{transition-duration:.01s}#ok.active .ring{animation:none}}
</style>
</head>
<body>
<main class="terminal">

  <section class="screen active" id="s1" aria-label="Сумма">
    <div class="brand"><button class="logo" id="logo" aria-label="Демо-режим" aria-pressed="false"></button>Терминал<button class="gear" id="gear" aria-label="Результат оплаты"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>
    <div class="label">Сумма к оплате</div>
    <div class="amount empty" id="amt" aria-live="polite">0 ₽</div>
    <div class="keys" id="keys"></div>
    <button class="go" id="next" disabled>Продолжить</button>
  </section>

  <section class="screen" id="s2" aria-label="Способ оплаты">
    <button class="back" id="back">‹ Изменить сумму</button>
    <div class="label" style="margin-top:14px">К оплате</div>
    <div class="sum" id="sum"></div>
    <div class="methods">
      <button class="method" data-m="qr">
        <svg viewBox="0 0 48 48" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="14" height="14" rx="3"/><rect x="28" y="6" width="14" height="14" rx="3"/><rect x="6" y="28" width="14" height="14" rx="3"/><path d="M28 28h5v5M42 28v0M28 42h5M38 36v6h4M42 33v0"/></svg>
        <span>Оплата по QR-коду<small>Покажите код на экране телефона</small></span>
      </button>
      <button class="method" data-m="face">
        <svg viewBox="0 0 48 48" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V9a3 3 0 0 1 3-3h7M32 6h7a3 3 0 0 1 3 3v7M42 32v7a3 3 0 0 1-3 3h-7M16 42H9a3 3 0 0 1-3-3v-7"/><path d="M17 29c1.6 3 4 4.5 7 4.5s5.4-1.500 7-4.500"/><path d="M18 19v2M30 19v2"/></svg>
        <span>Оплата улыбкой<small>Посмотрите в камеру и улыбнитесь</small></span>
      </button>
      <button class="method" data-m="nfc">
        <svg viewBox="0 0 48 48" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="26" height="18" rx="4"/><path d="M5 18h26"/><path d="M36 20c3 3 3 9 0 12M41 16c5 6 5 14 0 20"/></svg>
        <span>Картой / NFC<small>Приложите карту к терминалу</small></span>
      </button>
    </div>
  </section>

  <section class="screen" id="nfc" aria-label="Оплата картой">
    <button class="back" id="nfcCancel">‹ Отмена</button>
    <div class="label" style="margin-top:14px">Приложите карту или телефон</div>
    <div class="sum" id="nfcsum"></div>
    <div class="tap">
      <div class="waves"><span></span><span></span><span></span></div>
      <div class="card"></div>
    </div>
  </section>

  <section class="screen" id="err" aria-live="assertive">
    <div class="badge">
      <span class="ring"></span><span class="ring"></span>
      <span class="disc"></span>
      <svg viewBox="0 0 70 70"><path pathLength="100" d="M22 22l26 26"/><path pathLength="100" d="M48 22l-26 26"/></svg>
    </div>
    <h2>Оплата не прошла</h2>
    <p id="errmsg"></p>
    <div class="eact"><button class="eb ghost" id="errCancel">Отмена</button><button class="eb" id="errRetry">Повторить</button></div>
  </section>

  <section class="screen" id="ok" aria-live="polite">
    <div class="badge">
      <span class="ring"></span><span class="ring"></span>
      <span class="disc"></span>
      <svg viewBox="0 0 70 70"><path pathLength="100" d="M14 37l14 14 28-30"/></svg>
    </div>
    <h2>Оплачено</h2>
    <p id="paid"></p>
  </section>

<button class="demo-stop" id="demoStop">● Демо · остановить</button>
  <div class="sheet" id="sheet">
    <div class="sheet-box" role="dialog" aria-label="Результат оплаты">
      <h3>Результат оплаты</h3>
      <div id="opts" role="radiogroup"></div>
      <button class="go" id="sheetClose" style="width:100%">Готово</button>
    </div>
  </div>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var value="";
  var screens={s1:$("s1"),s2:$("s2"),nfc:$("nfc"),err:$("err"),ok:$("ok")};
  var busy=false;

  function fmt(v,typing){
    var p=String(v).split(",");
    var s=Number(p[0]||0).toLocaleString("ru-RU");
    if(p.length>1&&(typing||p[1]!==""))s+=","+(typing?p[1]:(p[1]+"00").slice(0,2));
    return s+" ₽";
  }
  function fit(el,base){
    var w=Math.min(window.innerWidth,540)-48;
    el.style.fontSize=Math.min(base,w/(el.textContent.length*.62))+"px";
  }
  function render(){
    var a=$("amt");
    a.textContent=value?fmt(value,true):"0 ₽";
    fit(a,60);
    a.classList.toggle("empty",!value);
    $("next").disabled=!(Number(value.replace(",","."))>0);
  }
  function show(name){
    for(var k in screens)screens[k].classList.toggle("active",k===name);
  }

  var keys=$("keys");
  ["1","2","3","4","5","6","7","8","9",",","0","⌫"].forEach(function(k){
    var b=document.createElement("button");
    b.type="button";b.textContent=k;
    if(k==="⌫")b.setAttribute("aria-label","Стереть");
    b.onclick=function(){
      if(k==="⌫")value=value.slice(0,-1);
      else if(k===","){if(value.indexOf(",")<0)value=(value||"0")+",";}
      else{
        var n=value+k;
        if(n.indexOf(",")<0)n=n.replace(/^0+/,"");
        var q=n.split(",");
        var num=Number(q[0]+"."+(q[1]||"0"));
        if(q[0].length<=10&&(!q[1]||q[1].length<=2)&&num<=1000000000)value=n;
      }
      render();
    };
    keys.appendChild(b);
  });

  $("next").onclick=function(){
    if(!(Number(value.replace(",","."))>0))return;
    $("sum").textContent=fmt(value);fit($("sum"),44);
    show("s2");
  };
  $("back").onclick=function(){show("s1")};

  var ctx;
  function chime(){
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==="suspended")ctx.resume();
      var t=ctx.currentTime;
      [[880,0],[1318.5,.14],[1760,.28]].forEach(function(n){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.type="sine";o.frequency.value=n[0];
        g.gain.setValueAtTime(0,t+n[1]);
        g.gain.linearRampToValueAtTime(.28,t+n[1]+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+n[1]+.6);
        o.connect(g);g.connect(ctx.destination);
        o.start(t+n[1]);o.stop(t+n[1]+.65);
      });
    }catch(e){}
  }

  var mode="ok";
  var MSG={funds:"Недостаточно средств на карте",declined:"Карта отклонена банком",network:"Нет связи с банком. Попробуйте ещё раз"};
  function outcome(){
    if(mode!=="random")return mode;
    var r=Math.random();
    return r<.6?"ok":["funds","declined","network"][Math.floor((r-.6)/.4*3)];
  }
  function buzz(){
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==="suspended")ctx.resume();
      var t=ctx.currentTime;
      [[330,0],[220,.22]].forEach(function(n){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.type="triangle";o.frequency.value=n[0];
        g.gain.setValueAtTime(0,t+n[1]);
        g.gain.linearRampToValueAtTime(.3,t+n[1]+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+n[1]+.4);
        o.connect(g);g.connect(ctx.destination);
        o.start(t+n[1]);o.stop(t+n[1]+.45);
      });
    }catch(e){}
  }
  function fail(o){
    buzz();
    $("errmsg").textContent=MSG[o];
    show("err");
  }
  var nfcTimer;
  function pay(){
    var o=outcome();
    if(o!=="ok"){fail(o);return;}
    chime();
    $("paid").textContent="Вы оплатили "+fmt(value);
    show("ok");
    setTimeout(function(){
      show("s1");
      setTimeout(function(){value="";render();busy=false},500);
    },3200);
  }
  document.querySelectorAll(".method").forEach(function(btn){
    btn.onclick=function(){
      if(busy)return;busy=true;
      if(btn.dataset.m==="nfc"){
        $("nfcsum").textContent=fmt(value);fit($("nfcsum"),44);
        show("nfc");
        nfcTimer=setTimeout(pay,2800);
      }else pay();
    };
  });
  $("nfcCancel").onclick=function(){clearTimeout(nfcTimer);busy=false;show("s2")};
  $("errRetry").onclick=function(){busy=false;show("s2")};
  $("errCancel").onclick=function(){show("s1");setTimeout(function(){value="";render();busy=false},500)};
  var OPTS=[["ok","Всегда успешно"],["random","Случайно"],["funds","Недостаточно средств"],["declined","Карта отклонена"],["network","Нет связи"]];
  var optsEl=$("opts");
  function sync(){
    [].forEach.call(optsEl.children,function(b,i){
      var on=OPTS[i][0]===mode;
      b.classList.toggle("sel",on);
      b.setAttribute("aria-checked",on);
    });
  }
  OPTS.forEach(function(o){
    var b=document.createElement("button");
    b.type="button";b.className="opt";b.setAttribute("role","radio");b.textContent=o[1];
    b.onclick=function(){mode=o[0];sync()};
    optsEl.appendChild(b);
  });
  sync();
  $("gear").onclick=function(){$("sheet").classList.add("open")};
  $("sheetClose").onclick=function(){$("sheet").classList.remove("open")};
  $("sheet").onclick=function(e){if(e.target===this)this.classList.remove("open")};

  var demoTok=0;
  function wait(ms,tok){return new Promise(function(r){setTimeout(function(){r(tok===demoTok)},ms)})}
  function tap(el){el.classList.add("press");setTimeout(function(){el.classList.remove("press")},200);el.click()}
  function keyBtn(ch){return [].filter.call(keys.children,function(b){return b.textContent===ch})[0]}
  async function demoLoop(tok){
    var list=["1250","349,90","25000","780","99,50","1000000"];
    var i=0;
    while(tok===demoTok){
      if(!(await wait(1000,tok)))return;
      value="";render();
      var a=list[i%list.length],m=i%3;i++;
      for(var c=0;c<a.length;c++){
        tap(keyBtn(a.charAt(c)));
        if(!(await wait(320,tok)))return;
      }
      if(!(await wait(700,tok)))return;
      tap($("next"));
      if(!(await wait(1400,tok)))return;
      tap(document.querySelectorAll(".method")[m]);
      for(var n=0;n<60;n++){
        if(!(await wait(250,tok)))return;
        if(screens.err.classList.contains("active")){
          if(!(await wait(3200,tok)))return;
          $("errCancel").click();
        }
        if(screens.s1.classList.contains("active")&&!busy)break;
      }
    }
  }
  function setDemo(on){
    demoTok++;
    $("logo").classList.toggle("on",on);
    $("logo").setAttribute("aria-pressed",on);
    $("demoStop").classList.toggle("on",on);
    if(on){$("sheet").classList.remove("open");demoLoop(demoTok)}
  }
  $("logo").onclick=function(){setDemo(!$("logo").classList.contains("on"))};
  $("demoStop").onclick=function(){setDemo(false)};
  render();
})();
</script>
</body>
</html>
